<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A little something</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="orb orb-one" aria-hidden="true"></div>
  <div class="orb orb-two" aria-hidden="true"></div>
  <div class="orb orb-three" aria-hidden="true"></div>
  <div class="orb orb-four" aria-hidden="true"></div>
  <div class="orb orb-five" aria-hidden="true"></div>
  <main class="container">
    <div class="card">
      <div id="date" class="date"></div>
      <div id="message" class="message"></div>
      <div id="progress" class="progress"></div>
      <div class="controls">
        <button id="prev" aria-label="Previous message">←</button>
        <button id="next" aria-label="Next message">→</button>
      </div>
    </div>
  </main>
  <script src="messages.js"></script>
  <script src="script.js"></script>
</body>
</html>
